<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Haystack Proposal</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: single editorial column. Term tabs drive the plan grid, then usage buckets, then the estimator.
   Palette is strictly the three brand colors; everything else is an alpha derivation of them. */
:root{
  --amber:#f5af01;
  --bg:#FFFFFF;
  --fg:#000000;
  --muted:rgba(0,0,0,.58);
  --line:rgba(0,0,0,.15);
  --line-soft:rgba(0,0,0,.08);
  --tint:rgba(245,175,1,.10);
  --tint-strong:rgba(245,175,1,.20);
  --plate:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --fg:#FFFFFF;
    --muted:rgba(255,255,255,.62);
    --line:rgba(255,255,255,.20);
    --line-soft:rgba(255,255,255,.10);
    --tint:rgba(245,175,1,.12);
    --tint-strong:rgba(245,175,1,.22);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --fg:#FFFFFF;
  --muted:rgba(255,255,255,.62);
  --line:rgba(255,255,255,.20);
  --line-soft:rgba(255,255,255,.10);
  --tint:rgba(245,175,1,.12);
  --tint-strong:rgba(245,175,1,.22);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg);
  font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;font-weight:400;line-height:1.62;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1060px;margin:0 auto;padding-inline:20px;padding-block:0 72px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.025em;line-height:1.16;text-wrap:balance}
h2{font-size:clamp(1.4rem,3.1vw,1.95rem)}
h3{font-size:1.08rem;letter-spacing:-.012em}
p{margin:0}
.eyebrow{font-size:.7rem;font-weight:600;letter-spacing:.17em;text-transform:uppercase;color:var(--amber)}
.num{font-variant-numeric:tabular-nums}

.notice{
  background:var(--tint);border:1px solid var(--amber);border-radius:3px;
  padding:14px 16px;display:flex;gap:12px;align-items:flex-start;
  font-size:.87rem;line-height:1.52;margin-block:24px 0;font-weight:300;
}
.notice-tag{
  font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  color:var(--amber);border:1px solid var(--amber);border-radius:2px;
  padding:3px 7px;white-space:nowrap;flex:none;margin-top:1px;
}
.notice b{font-weight:600}
.notice-top{margin-block:16px 0;padding:9px 14px;font-size:.8rem;align-items:center}

header{padding-block:36px 0}
.mark{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mark img{display:block;height:52px;width:auto;max-width:100%}
.mark-plate{display:inline-flex;flex:none}
.logo-dark{display:none!important}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .logo-light{display:none!important}
  :root:not([data-theme="light"]) .logo-dark{display:block!important}
}
:root[data-theme="dark"] .logo-light{display:none!important}
:root[data-theme="dark"] .logo-dark{display:block!important}
.ph{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;border-bottom:3px solid var(--amber);padding-bottom:14px}
.prep{text-align:right;display:flex;flex-direction:column;gap:2px}
.prep .eyebrow{color:var(--fg)}
.prep p:last-child{font-size:13px;color:var(--muted)}
@media (max-width:560px){.prep{text-align:left}}
.page-title{font-size:clamp(1.8rem,4.4vw,2.6rem);font-weight:700;letter-spacing:-.03em;line-height:1.12;margin-bottom:14px}
.plan .caps dd{white-space:normal;max-width:14ch;line-height:1.3}
.mark-sub{font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:500}

.intro{margin-top:40px;max-width:none}
.intro-lead{font-size:clamp(1.12rem,2.3vw,1.42rem);font-weight:400;line-height:1.46;letter-spacing:-.015em}
.intro-lead b{font-weight:600;color:var(--amber)}
.intro-body{margin-top:16px;font-size:.98rem;font-weight:300;line-height:1.6;color:var(--muted)}
.intro-body b{font-weight:600;color:var(--fg)}
.principles-lead{color:var(--fg);font-weight:300}
.principles{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.principles li{display:flex;gap:12px;align-items:flex-start}
.principles li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--amber);flex:none;margin-top:.62em}

section{margin-block:62px 0}
.sec-head{max-width:64ch;margin-bottom:28px;display:flex;flex-direction:column;gap:11px}

.toggle-bar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:24px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;padding:3px;gap:3px;background:var(--bg)}
.seg button{
  font-family:inherit;font-size:.87rem;font-weight:500;background:none;border:0;
  color:var(--muted);padding:9px 18px;border-radius:2px;cursor:pointer;transition:background .15s,color .15s;
}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--amber);color:#000000;font-weight:600}
.seg button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.term-row{flex-basis:100%;display:flex;align-items:center;gap:8px;margin-top:4px}
.mini-seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;padding:2px;gap:2px}
.mini-seg button{font-family:inherit;font-size:.74rem;font-weight:500;background:none;border:0;color:var(--muted);padding:4px 10px;border-radius:2px;cursor:pointer}
.mini-seg button[aria-pressed="true"]{background:var(--amber);color:#000;font-weight:600}
.mini-seg button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.price-save.is-hidden{visibility:hidden}
.price-fig{min-width:4.2ch}
.price-per{flex-basis:100%}
.toggle-note{font-size:.85rem;color:var(--muted);font-weight:300}

.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;align-items:start}
.plan{border:1px solid var(--line);border-radius:5px;padding:26px 20px;display:flex;flex-direction:column;gap:7px;min-width:0;background:var(--bg)}
.plan.selected{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber);background:var(--tint)}
.plan > .caps,.plan > .feat-wrap{margin-top:13px}
.plan-for{font-size:.88rem;color:var(--muted);font-weight:300}
/* Card rows share one grid so names, descriptions, prices and caps line up across plans */
@supports (grid-template-rows:subgrid){
  .plans{align-items:stretch}
  .plan{display:grid;grid-template-rows:subgrid;grid-row:span 5;row-gap:7px}
}
.price{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px;margin-top:8px}
.price-fig.tbd{color:var(--muted)}
.price-per b.scoped{font-weight:700;color:var(--amber)}
.price-fig{font-size:2.6rem;font-weight:700;letter-spacing:-.035em}
.price-per{font-size:.84rem;color:var(--muted);font-weight:400}
.price-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-top:2px}
.price-term{font-size:.8rem;color:var(--muted);font-weight:400}
.price-save{font-size:.73rem;font-weight:600;color:#000000;background:var(--amber);padding:2px 7px;border-radius:2px;letter-spacing:.01em}

.plan > .caps-wrap{margin-top:13px}
.access-label{font-size:.8rem;font-weight:600;margin-bottom:8px}
.plans-note{font-size:.92rem;color:var(--muted);font-weight:300;margin:0 0 24px;max-width:none}
.caps{margin:0;display:flex;flex-direction:column;border-top:1px solid var(--line-soft)}
.caps > div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:.82rem;line-height:1.35}
.caps dt{color:var(--muted);font-weight:300;flex:1 1 auto;min-width:0}
.caps dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;flex:none;white-space:nowrap}
/* Bullets sit directly under the limits instead of floating at the bottom of a stretched row */
.caps-wrap > .feat-wrap{margin-top:18px}
.caps dd small{display:block;font-weight:300;color:var(--muted);font-size:.72rem;line-height:1.35;margin-top:1px}
.feat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:.89rem;font-weight:300}
.feat li{display:flex;gap:10px;align-items:flex-start}
.feat li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--amber);flex:none;margin-top:.55em}
.feat li.head{
  font-size:.63rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;
  padding-bottom:3px;
}
.feat li.head::before{display:none}
.feat li.head:not(:first-child){margin-top:10px}

.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(246px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.buckets > div{background:var(--bg);padding:24px 22px;display:flex;flex-direction:column;gap:10px}
.buckets p{font-size:.9rem;color:var(--muted);font-weight:300}
.b-mark{width:26px;height:3px;border-radius:2px;background:var(--amber);flex:none}

.est{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:30px;border:1px solid var(--line);border-radius:5px;padding:28px 26px}
@media (max-width:760px){.est{grid-template-columns:1fr;gap:24px}}
.sliders{display:flex;flex-direction:column;gap:21px;min-width:0}
.slider label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:.87rem;margin-bottom:9px;font-weight:500}
.slider output{font-weight:600;font-variant-numeric:tabular-nums;color:var(--amber)}
input[type=range]{width:100%;accent-color:var(--amber);margin:0}
.slider.is-off{opacity:.35}
.slider.is-off input[type=range]{filter:grayscale(1);cursor:not-allowed}
.readout{display:flex;flex-direction:column;gap:16px;min-width:0;border-left:1px solid var(--line-soft);padding-left:28px}
@media (max-width:760px){.readout{border-left:0;border-top:1px solid var(--line-soft);padding-left:0;padding-top:24px}}
.readout-fig{font-size:2.7rem;font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1}
.breakdown{list-style:none;margin:0;padding:0;font-size:.83rem;color:var(--muted);display:flex;flex-direction:column;gap:7px;font-weight:300}
.fit{border-top:1px solid var(--line-soft);padding-top:14px;display:flex;flex-direction:column;gap:4px}
.fit-name{font-size:1.15rem;font-weight:700;letter-spacing:-.015em}
.readout .fit-top{display:flex;flex-direction:column;gap:4px}
.readout .fit-top .fit-name{font-size:1.75rem;line-height:1.1;letter-spacing:-.025em;color:var(--amber)}
.readout .fit-top .fit-name.promoted{color:var(--amber)}
.est-unit{font-size:.84rem;color:var(--muted);font-weight:300;margin-top:4px}
.term-cmp{border-top:1px solid var(--line-soft);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.term-cmp ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.term-cmp button{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:inherit;font-size:.86rem;color:var(--fg);background:none;border:1px solid var(--line-soft);border-radius:4px;padding:8px 11px;cursor:pointer;text-align:left}
.term-cmp button:hover{border-color:var(--line)}
.term-cmp button[aria-pressed="true"]{border-color:var(--amber);background:var(--tint)}
.term-cmp button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.tc-label{font-weight:500}
.tc-right{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.tc-price{font-weight:700}
.tc-save{font-size:.7rem;font-weight:600;color:#000;background:var(--amber);padding:1px 6px;border-radius:2px}
.term-cmp .tc-note{font-size:.82rem;color:var(--muted);font-weight:300;line-height:1.45}
.fit-note{font-size:.84rem;color:var(--muted);font-weight:300;line-height:1.45}
.breakdown li{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}

.ratecard{background:var(--tint);border-radius:4px;padding:16px 17px;display:flex;flex-direction:column;gap:12px}
.rc-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.ratecard ul.rc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 28px}
.ratecard-title{font-size:.63rem;letter-spacing:.13em;text-transform:uppercase;color:var(--amber);font-weight:600}
.ratecard ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.ratecard li{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.rc-name{font-size:.86rem;font-weight:500;line-height:1.3}
.rc-unit{font-size:.76rem;color:var(--muted);font-weight:300;display:block;margin-top:1px}
.rc-note{font-size:.8rem;color:var(--muted);font-weight:300;margin-top:10px}
.rc-price{font-size:.95rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

.faq{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.faq > div{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.05fr);
  gap:28px;align-items:start;padding-block:24px;border-bottom:1px solid var(--line-soft);
}
@media (max-width:700px){.faq > div{grid-template-columns:1fr;gap:9px;padding-block:20px}}
.faq h3{padding-top:1px}
.faq p{font-size:.9rem;color:var(--muted);font-weight:300;min-width:0}

footer{display:none;margin-top:70px;padding-top:26px;border-top:1px solid var(--line);flex-direction:column;gap:13px;font-size:.84rem;color:var(--muted);font-weight:300}
footer b{font-weight:600;color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  bucketsEyebrow: "Data Usage Definitions",

  buckets: [

    { title: "Custom Analysis Briefs",

    { title: "Feed Sources Discovery",

  ],

  estEyebrow: "Usage",
  estTitle: "Understand Pricing",
  estReadout: "Estimated monthly cost",
  estUnit: "per month",
  estNote: "Prices are estimates based on average data usage per function. Exact usage costs will vary. Estimates assume Feeds built from accounts, an even mix of TikTok, X, Instagram, YouTube and Facebook, and account discovery as set on the slider.",
  fitLabel: "Plan Sizing",
  fitBase: "The {plan} plan covers this scale",
  fitPromoted: "Moved up from {from}: {reasons}.",
  fitReason: "{value} {label} ({from} allows {cap})",
  fitReasonNone: "{label} (not included in {from})",
  fitCustom: "Beyond Enterprise limits &mdash; a Custom plan would be scoped with you.",
  fitUnder: "Your plan includes this usage",
  fitOver: "You'll pay this amount for total usage, including your base plan",
  cmpLabel: "Same usage, by commitment",
  cmpSave: "Save {amt}/mo",
  cmpNote: "Committing to 12 months instead of 3 saves about {amt} a month on this usage.",
  cmpNoteCustom: "Custom plans are scoped with you, so these figures use Enterprise rates as a guide.",

  /* ---- SLIDERS: label, range and starting value for each input ---- */
  sliders: [
    { id: "feeds",     label: "Feeds",                          min: 0,   max: 20,    step: 1,   value: 1,   suffix: "", floor: 1 },
    { id: "size",      label: "Sources",                        min: 0,   max: 40000, step: 100, value: 0,   suffix: " sources" },
    { id: "pinned",    label: "Daily Analysis Briefs",                 min: 0,   max: 100,   step: 1,   value: 0,   suffix: "" },
    { id: "briefs",    label: "Custom Analysis Briefs per Month",        min: 0,   max: 60,    step: 1,   value: 0,   suffix: "" }
  ],

  /* ---- TIER REFERENCE USAGE: the usage that comes out at exactly each tier's

         These are the Budget Planner's original scenarios (800 sources per Feed, and 500 / 500 / 1,000
         discovered accounts per Feed written as totals); at cost they come to $200.38 / $504.86 /
         $2,055.40. The estimator now prices usage at cost with no per-plan scaling, so moving from one

  tierStart: {

    org:  { feeds: 5,  size: 800,   pinned: 10, briefs: 10, discovery: 2500 },
    ent:  { feeds: 20, size: 800,   pinned: 40, briefs: 30, discovery: 20000 }
  },

  /* ---- PLAN CAPS: your plan is the smallest tier whose caps cover every slider.
         From the Budget Planner tab, "Hard Caps" block. Sources are unlimited on every plan,
         so they change the cost but never the plan. ---- */
  tierCaps: {
    team: { feeds: 2,  pinned: 4,   briefs: 0,  discovery: 1000 },
    org:  { feeds: 5,  pinned: 15,  briefs: 20, discovery: 5000 },
    ent:  { feeds: 20, pinned: 100, briefs: 60, discovery: 10000 }
  },

  /* ---- EXAMPLE USAGE: ballpark prices shown as written (no commitment scaling). ---- */
  rateCardTitle: "Example Usage",
  rateCardNote: "Usage costs are estimated based on averages and can vary.",
  rateCard: [
    { name: "Feed",                   unit: "1,000 sources from different platforms",                  price: "$110/mo" },
    { name: "Custom Analysis Brief",  unit: "5,000 posts analyzed based on user question",              price: "$2" },
    { name: "Daily Analysis Brief",   unit: "A daily recurring report on trends in example feed",       price: "$7/mo" },
    { name: "Source Discovery",       unit: "Automated discovery of accounts fitting your focus, per 1,000", price: "$4" }
  ],

  /* ---- RATES: the exact cost-model figures the estimator uses. The rate card above shows
         rounded ballpark versions of these ($107 -> $110, $6.30 -> $7, $0.39 -> $0.50, $3.99 -> $4). ---- */
  /* Copied from "Haystack Cost Structure & Pricing Model", Sensitivity Tables tab,
     with an even mix of TikTok, X, Instagram, YouTube and Facebook. These reproduce
     the Budget Planner's "Cost per month" exactly ($200.38 / $504.86 / $2,055.40). */
  rates: {
    perAccount:          0.10700988,  /* $ per account per month (rows 140, averaged)         */
    postsPerAccount:     26.0517657,  /* posts per account per month (row 141, averaged)      */
    perDiscovered:       0.00398565,  /* $ per discovered account (row 146, averaged)         */

  },

  faqEyebrow: "Frequently Asked Questions",
  faq: [
    { q: "What if I use less than my plan includes?",
      a: "The full value of your plan is applied to usage each month. You are billed the plan price each month whether or not your usage reaches it, and unused value does not carry over to future months. We help you size your plan so that it matches the work you actually run." },
    { q: "What if I use more than my plan includes?",
      a: "You can use more at any time and pay only for exactly what you use. Additional usage is added to your invoice, itemized by function, so you can see exactly where your spending occurs." },

    { q: "Do you charge per seat?",

};

/* ============================================================================
   PAGE MACHINERY — no copy below this line
   ========================================================================== */
(function(){
  "use strict";
  var C = CONTENT;
  var R = C.rates;

  var termIndex = 0;
  for (var i = 0; i < C.terms.length; i++){ if (C.terms[i].months === C.defaultTerm){ termIndex = i; } }

  function $(id){ return document.getElementById(id); }
  function txt(id, v){ var e = $(id); if (e){ e.innerHTML = v; } }
  function money(n){ return "$" + Math.round(n).toLocaleString("en-US"); }
  function nf(n){ return n.toLocaleString("en-US"); }

  txt("c-disclaimer1", C.disclaimer1);
  txt("c-intro", C.intro);
  txt("c-intro2", C.intro2);
  txt("c-plans-eyebrow", C.plansEyebrow);
  txt("c-toggle-note", C.toggleNote);
  txt("c-plans-note", C.plansNote);
  txt("c-plans-title", C.plansTitle);
  txt("c-buckets-eyebrow", C.bucketsEyebrow);
  txt("c-buckets-title", C.bucketsTitle);
  txt("c-est-eyebrow", C.estEyebrow);
  txt("c-est-title", C.estTitle);
  txt("c-est-readout", C.estReadout);
  txt("c-est-unit", C.estUnit);
  txt("c-est-note", C.estNote);
  txt("c-rc-title", C.rateCardTitle);
  txt("c-rc-note", C.rateCardNote);
  txt("c-fit-label", C.fitLabel);
  txt("c-cmp-label", C.cmpLabel);
  txt("c-faq-eyebrow", C.faqEyebrow);
  txt("c-foot1", C.footer1);
  txt("c-foot2", C.footer2);
  ["c-draft1"].forEach(function(id){ txt(id, C.draftTag); });

  $("c-buckets").innerHTML = C.buckets.map(function(b){
    return '<div><span class="b-mark"></span><h3>' + b.title + '</h3><p>' + b.body + '</p></div>';
  }).join("");

  if ($("c-rc-list")) $("c-rc-list").innerHTML = C.rateCard.map(function(r){
    return '<li><span class="rc-name">' + r.name + '<span class="rc-unit">' + r.unit + '</span></span>' +
           '<span class="rc-price">' + r.price + '</span></li>';
  }).join("");

  $("c-faq").innerHTML = C.faq.map(function(f){
    return '<div><h3>' + f.q + '</h3><p>' + f.a + '</p></div>';
  }).join("");

  /* Commitment tabs: one set at the top of the plans, one on the rate card. They stay in sync. */
  function termButtons(){
    return C.terms.map(function(t, j){
      return '<button type="button" data-i="' + j + '" aria-pressed="' + (j === termIndex) + '">' + t.label + '</button>';
    }).join("");
  }
  $("c-seg").innerHTML = termButtons();

  /* The sliders run all the way to the Enterprise caps; the plan is picked from where they land. */
  var topCaps = C.tierCaps.ent;
  $("c-sliders").innerHTML = C.sliders.map(function(s){
    var max = (s.id in topCaps) ? Math.min(s.max, topCaps[s.id]) : s.max;
    return '<div class="slider">' +
      '<label for="s-' + s.id + '">' + s.label + ' <output id="o-' + s.id + '" for="s-' + s.id + '"></output></label>' +
      '<input type="range" id="s-' + s.id + '" min="' + s.min + '" max="' + max + '" step="' + s.step + '" value="' + s.value + '">' +
    '</div>';
  }).join("");

  /* Rate card: 12-month figures as written, scaled by the plan-minimum ratio for shorter terms. */

  var tierKey = "team";

  function renderPlans(){
    ["c-seg"].forEach(function(id){
      $(id).querySelectorAll("button").forEach(function(b){
        b.setAttribute("aria-pressed", String(Number(b.dataset.i) === termIndex));
      });
    });
    var t = C.terms[termIndex];
    $("c-plans").innerHTML = C.plans.map(function(p){
      var cur = p.custom ? null : t.priceValue[p.key];
      var fig = p.custom ? p.customPrice : t.price[p.key];
      var figClass = p.custom ? ' custom' : (cur === null ? ' tbd' : '');
      var unit = p.custom ? p.customUnit : C.priceUnit;
      var items = [];
      if (p.featuresHeading && p.features.length){ items.push('<li class="head">' + p.featuresHeading + '</li>'); }
      p.features.forEach(function(f){ items.push('<li>' + f + '</li>'); });
      if (p.extraFeatures && p.extraFeatures.length){
        if (p.extraHeading){ items.push('<li class="head">' + p.extraHeading + '</li>'); }
        p.extraFeatures.forEach(function(f){ items.push('<li>' + f + '</li>'); });
      }
      var list = items.length ? '<ul class="feat">' + items.join("") + '</ul>' : '';
      var caps = (p.caps && p.caps.length) ? '<dl class="caps">' + p.caps.map(function(c){
        return '<div><dt>' + c[0] + '</dt><dd>' + c[1] + (c[2] ? '<small>' + c[2] + '</small>' : '') + '</dd></div>';
      }).join("") + '</dl>' : '';
      var save = '';
      if (!p.custom){
        var pct = Math.round((1 - cur / C.terms[0].priceValue[p.key]) * 100);
        save = '<span class="price-save' + (pct > 0 ? '' : ' is-hidden') + '">' + C.saveLabel.replace("{pct}", Math.max(pct, 0)) + '</span>';
      }
      return '<div class="plan' + (p.key === tierKey ? ' selected' : '') + '">' +
          '<h3>' + p.name + '</h3>' +
          '<p class="plan-for">' + p.forWhom + '</p>' +
          '<div class="price">' + (fig ? '<span class="price-fig num' + figClass + '">' + fig + '</span>' : '') +
            '<span class="price-per">' + unit + '</span></div>' +
          '<div class="price-meta">' + (p.custom ? '' : '<span class="price-term">' + t.termLabel + '</span>' + save) + '</div>' +
        '<div class="caps-wrap"><p class="access-label">' + C.accessLabel + '</p>' + caps + '<div class="feat-wrap">' + list + '</div></div>' +
      '</div>';
    }).join("");
  }

  function val(id){ return Number($("s-" + id).value); }

  /* Monthly cost from the cost model. "sources" is the total across all Feeds.
     Each Daily Analysis (pinned question) runs daily, plus one Research Assistant call per 9,000 posts
     its Feed collects (sources / Feeds). Feed sources discovery is not part of the estimate. */
  function costModelUsage(feeds, sources, pinned, briefs){
    var researchCalls = feeds > 0 ? Math.ceil((sources / feeds) * R.postsPerAccount / R.postsPerResearchCall) : 0;
    var perQuestion = (R.perPinnedCall + researchCalls * R.perResearchCall) * R.daysPerMonth;
    return sources * R.perAccount
      + pinned * perQuestion
      + briefs * R.perBrief;
  }

  var ORDER = ["team", "org", "ent"];

  /* Your plan is the smallest tier whose limits cover every slider; past Enterprise it is Custom.
     Sources have no plan limit, so they only change the cost. */
  function covers(tier){
    var caps = C.tierCaps[tier], ok = true;
    C.sliders.forEach(function(s){ if ((s.id in caps) && val(s.id) > caps[s.id]){ ok = false; } });
    return ok;
  }
  function pickTier(){
    for (var i = 0; i < ORDER.length; i++){ if (covers(ORDER[i])){ return ORDER[i]; } }
    return "custom";
  }

  function planByKey(k){ for (var i = 0; i < C.plans.length; i++){ if (C.plans[i].key === k){ return C.plans[i]; } } return null; }

  /* Why the plan moved up: each slider that is over the next-smaller plan's limit. */
  function promotionReasons(fromKey){
    var caps = C.tierCaps[fromKey], from = planByKey(fromKey).name, out = [];
    C.sliders.forEach(function(s){
      if (!(s.id in caps) || val(s.id) <= caps[s.id]){ return; }
      out.push(caps[s.id] === 0
        ? C.fitReasonNone.replace("{label}", s.label).replace("{from}", from)
        : C.fitReason.replace("{value}", nf(val(s.id))).replace("{label}", s.label)
            .replace("{from}", from).replace("{cap}", nf(caps[s.id])));
    });
    return out;
  }

  /* Estimate for one commitment: usage at cost, scaled by the plan-minimum ratio for shorter terms
     (3 mo = 2x, 6 mo = 1.5x the 12-month rate), and never below the plan's minimum for that term. */
  function estimateFor(t, priceTier, usage){
    var base = C.terms[C.terms.length - 1].priceValue[priceTier];
    var min = C.terms[t].priceValue[priceTier];
    return { min: min, total: Math.max(usage * min / base, min) };
  }

  function renderEstimate(){
    C.sliders.forEach(function(s){
      $("o-" + s.id).textContent = nf(val(s.id)) + s.suffix;
    });
    var feeds = val("feeds"), sources = val("size"), pinned = val("pinned"), briefs = val("briefs");

    tierKey = pickTier();
    renderPlans();

    var priceTier = tierKey === "custom" ? "ent" : tierKey;
    var usage = costModelUsage(feeds, sources, pinned, briefs);
    var est = estimateFor(termIndex, priceTier, usage);
    var term = C.terms[termIndex].termLabel.replace(" commitment", "");
    $("o-total").textContent = money(est.total);

    /* Plan sizing: the same line on every plan, naming the plan these settings land on */
    var fitEl = $("o-fit");
    var planName = planByKey(tierKey).name;
    fitEl.textContent = planName;
    fitEl.classList.toggle("promoted", ORDER.indexOf(tierKey) !== 0);
    $("o-fit-why").innerHTML = C.fitBase.replace("{plan}", planName);
    $("o-fit-note").innerHTML = tierKey === "custom" ? "" : (est.total <= est.min + 0.5 ? C.fitUnder : C.fitOver)
      .replace("{min}", money(est.min)).replace("{extra}", money(est.total - est.min)).replace("{term}", term);
  }

  function setTerm(i){
    termIndex = i;
    renderEstimate();
  }
  ["c-seg"].forEach(function(id){
    $(id).addEventListener("click", function(e){
      var b = e.target.closest("button");
      if (!b) { return; }
      setTerm(Number(b.dataset.i));
    });
  });
  C.sliders.forEach(function(s){
    $("s-" + s.id).addEventListener("input", function(){
      if (s.floor && val(s.id) < s.floor){ $("s-" + s.id).value = s.floor; }
      renderEstimate();
    });
  });

  renderEstimate();
})();
</script>
